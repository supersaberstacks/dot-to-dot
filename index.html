<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A4 Dot-to-Dot Generator</title>
<meta name="description" content="Generate a printable A4 dot-to-dot puzzle. Refresh for a new one, then print.">
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --line: #2e333c;
    --text: #e7e9ee;
    --muted: #9aa2b1;
    --accent: #5b8cff;
    --paper-w: 210mm;
    --paper-h: 297mm;
    --pad: 12mm;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .controls {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }

  .brand { font-weight: 650; letter-spacing: .2px; margin-right: 6px; white-space: nowrap; }

  .field {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    white-space: nowrap;
  }

  select, input[type="text"] {
    background: #12141a;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 8px;
    font: inherit;
    font-size: 14px;
  }

  input[type="text"] { width: 11ch; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }

  button {
    border: 1px solid var(--line);
    background: #262b33;
    color: var(--text);
    border-radius: 7px;
    padding: 7px 14px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover { border-color: #4a515e; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1020; }
  button.primary:hover { background: #7aa2ff; border-color: #7aa2ff; }

  .spacer { flex: 1 1 auto; }
  .hint { color: var(--muted); font-size: 13px; }

  kbd {
    background: #12141a;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
    font: inherit;
    font-size: 12px;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 24px 12px 48px;
  }

  .sheet {
    width: var(--paper-w);
    height: var(--paper-h);
    max-width: 100%;
    padding: var(--pad);
    background: #fff;
    color: #000;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
  }

  .sheet-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 0.5pt solid #000;
    padding-bottom: 2mm;
    margin-bottom: 3mm;
  }

  .sheet-title {
    font-size: 12pt;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
  }

  .sheet-meta {
    font-size: 7.5pt;
    letter-spacing: .04em;
    color: #444;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }

  .art { flex: 1 1 auto; min-height: 0; display: flex; }
  .art svg { width: 100%; height: 100%; display: block; }

  .sheet-foot {
    font-size: 7.5pt;
    color: #444;
    text-align: center;
    padding-top: 2mm;
  }

  #answerSheet[hidden] { display: none; }

  @media print {
    html, body { background: #fff; }
    .controls, .stage > .hint { display: none !important; }
    .stage { padding: 0; gap: 0; display: block; }
    .sheet { box-shadow: none; width: var(--paper-w); height: var(--paper-h); break-inside: avoid; }
    .sheet + .sheet { break-before: page; }
  }
</style>
</head>
<body>

<div class="controls">
  <span class="brand">⠿ A4 Dot-to-Dot</span>

  <label class="field">
    Subject
    <select id="subject"><option value="">Random</option></select>
  </label>

  <label class="field">
    Difficulty
    <select id="difficulty">
      <!-- "about": the count depends on the drawing - a castle is all
           corners, a whale is all curves - and the sheet reports the real one. -->
      <option value="medium" selected>Medium — about 100 dots</option>
      <option value="hard">Hard — about 150 dots</option>
      <option value="epic">Epic — about 250 dots</option>
    </select>
  </label>

  <label class="field">
    Paper
    <select id="orientation">
      <option value="auto" selected>Auto — fit subject</option>
      <option value="portrait">A4 portrait</option>
      <option value="landscape">A4 landscape</option>
    </select>
  </label>

  <label class="field">
    Seed
    <input type="text" id="seed" spellcheck="false" autocomplete="off">
  </label>

  <label class="field"><input type="checkbox" id="withAnswer"> Answer page</label>

  <div class="spacer"></div>

  <button class="primary" id="refresh" title="New puzzle (R)">↻ New puzzle</button>
  <button id="print" title="Print (Ctrl+P)">🖨 Print</button>
</div>

<div class="stage">
  <section class="sheet" id="puzzleSheet">
    <header class="sheet-head">
      <div class="sheet-title">Join the Dots</div>
      <div class="sheet-meta" id="puzzleMeta"></div>
    </header>
    <div class="art" id="puzzleArt"></div>
    <div class="sheet-foot" id="puzzleFoot">Start at 1 and join the dots in order. What is it?</div>
  </section>

  <section class="sheet" id="answerSheet" hidden>
    <header class="sheet-head">
      <div class="sheet-title" id="answerTitle">Answer</div>
      <div class="sheet-meta" id="answerMeta"></div>
    </header>
    <div class="art" id="answerArt"></div>
  </section>

  <p class="hint"><kbd>R</kbd> new puzzle · <kbd>Ctrl</kbd>+<kbd>P</kbd> print · the seed in the URL reproduces the exact same puzzle</p>
</div>

<script src="lineart.js"></script>
<script src="art.js"></script>
<script src="puzzle.js"></script>
<script>
(() => {
  "use strict";

  const SUBJECTS = window.DOT_ART || [];
  const { PRESETS } = window.Puzzle || {};

  const PAPER = { portrait: { w: 210, h: 297 }, landscape: { w: 297, h: 210 } };
  const PAD = 12;
  const HEAD = 11;
  const FOOT = 7;

  const randomSeed = () => Math.random().toString(36).slice(2, 8).toUpperCase();

  // ------------------------------------------------------------------ app
  const el = {
    subject: document.getElementById("subject"),
    difficulty: document.getElementById("difficulty"),
    orientation: document.getElementById("orientation"),
    seed: document.getElementById("seed"),
    withAnswer: document.getElementById("withAnswer"),
    refresh: document.getElementById("refresh"),
    print: document.getElementById("print"),
    puzzleArt: document.getElementById("puzzleArt"),
    puzzleMeta: document.getElementById("puzzleMeta"),
    puzzleFoot: document.getElementById("puzzleFoot"),
    answerSheet: document.getElementById("answerSheet"),
    answerArt: document.getElementById("answerArt"),
    answerMeta: document.getElementById("answerMeta"),
    answerTitle: document.getElementById("answerTitle")
  };

  const pageStyle = document.createElement("style");
  document.head.appendChild(pageStyle);

  for (const s of SUBJECTS.slice().sort((a, b) => a.name.localeCompare(b.name))) {
    const o = document.createElement("option");
    o.value = s.name;
    o.textContent = s.name;
    el.subject.appendChild(o);
  }

  function areaFor(orientation) {
    const paper = PAPER[orientation];
    return { w: paper.w - PAD * 2, h: paper.h - PAD * 2 - HEAD - FOOT };
  }

  function readState() {
    return {
      subject: el.subject.value,
      difficulty: el.difficulty.value,
      orientation: el.orientation.value,
      seed: el.seed.value.trim().toUpperCase() || randomSeed(),
      answer: el.withAnswer.checked
    };
  }

  function writeHash(s) {
    const p = new URLSearchParams({ d: s.difficulty, o: s.orientation, s: s.seed });
    if (s.subject) p.set("t", s.subject);
    if (s.answer) p.set("ans", "1");
    history.replaceState(null, "", "#" + p.toString());
  }

  function readHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    if (p.get("d") in PRESETS) el.difficulty.value = p.get("d");
    if (p.get("o") === "auto" || p.get("o") in PAPER) el.orientation.value = p.get("o");
    if (p.get("s")) el.seed.value = p.get("s").toUpperCase();
    if (p.get("t") && SUBJECTS.some(s => s.name === p.get("t"))) el.subject.value = p.get("t");
    el.withAnswer.checked = p.get("ans") === "1";
  }

  function draw() {
    if (!SUBJECTS.length || !window.Puzzle || !window.LineArt) {
      el.puzzleArt.innerHTML =
        '<p style="font:12pt system-ui;color:#900;padding:10mm">The puzzle scripts failed to load. ' +
        'Serve the folder over http:// if your browser blocks local scripts.</p>';
      return;
    }

    const state = readState();
    el.seed.value = state.seed;

    const preset = PRESETS[state.difficulty];
    const rand = Puzzle.mulberry32(Puzzle.hashSeed(state.seed));

    // Every subject is drawn at every difficulty: the art itself gains detail
    // as the difficulty rises, so nothing needs excluding.
    const pick = Math.floor(rand() * SUBJECTS.length);
    const subject = state.subject ? SUBJECTS.find(s => s.name === state.subject) : SUBJECTS[pick];

    // A wide subject on portrait paper leaves half the sheet empty, so on Auto
    // the paper turns instead of the picture.
    const orientation = state.orientation === "auto"
      ? (Puzzle.aspectOf(subject, preset) > 1.15 ? "landscape" : "portrait")
      : state.orientation;

    const paper = PAPER[orientation];
    document.documentElement.style.setProperty("--paper-w", paper.w + "mm");
    document.documentElement.style.setProperty("--paper-h", paper.h + "mm");
    pageStyle.textContent = `@page { size: A4 ${orientation}; margin: 0; }`;

    const area = areaFor(orientation);
    const model = Puzzle.build(subject, preset, area.w, area.h, rand);

    // The subject name is deliberately kept off the puzzle sheet - printing it
    // would give the answer away.
    const lineNote = model.lines > 1 ? ` · ${model.lines} LINES` : "";
    el.puzzleMeta.textContent =
      `${state.difficulty.toUpperCase()} · ${model.count} DOTS${lineNote} · SEED ${state.seed}`;
    el.answerMeta.textContent = `SEED ${state.seed}`;
    el.answerTitle.textContent = "Answer — " + subject.name;

    el.puzzleFoot.textContent = model.lines > 1
      ? "Join the dots in order, from 1. A ringed dot with a bold number starts a new line: lift your pencil and carry on from there. What is it?"
      : "Join the dots in order, from 1. What is it?";

    el.puzzleArt.innerHTML = Puzzle.renderPuzzle(model, preset, area.w, area.h);
    el.answerSheet.hidden = !state.answer;
    el.answerArt.innerHTML = state.answer ? Puzzle.renderAnswer(model, area.w, area.h) : "";

    writeHash(state);
  }

  function newPuzzle() {
    el.seed.value = randomSeed();
    draw();
  }

  el.refresh.addEventListener("click", newPuzzle);
  el.print.addEventListener("click", () => window.print());
  for (const id of ["subject", "difficulty", "orientation", "seed", "withAnswer"])
    el[id].addEventListener("change", draw);

  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;
    if (e.key === "r" || e.key === "R") { e.preventDefault(); newPuzzle(); }
  });

  window.addEventListener("hashchange", () => { readHash(); draw(); });

  readHash();
  draw();
})();
</script>
</body>
</html>
